<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>張添盛 專業保險諮詢</title>

    <style>
      /* --- 紅與駝色奢華配色 (優化版) --- */
      :root {
        --camel-bg: #E6D2B5;
        --red-deep: #8B2228; 
        --red-accent: #C1464D;
        --camel-dark: #C29B6B; 
        
        --text-primary: #2A1B1B;
        --text-secondary: #5A4A42;
        
        --glass-bg: rgba(255, 252, 245, 0.96);
        --glass-border: rgba(255, 255, 255, 0.7);
      }
    
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
      body {
        margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", sans-serif;
        background: linear-gradient(135deg, #E6D2B5 0%, #F5E8DC 50%, #DBC0C2 100%);
        color: var(--text-primary);
        display: flex; justify-content: center;
        min-height: 100vh;
      }
    
      /* 手機容器 */
      .mobile-container {
        width: 100%; max-width: 450px;
        background: rgba(255,255,255,0.05);
        position: relative; display: flex; flex-direction: column;
        min-height: 100vh; overflow-x: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.1);
      }
    
      /* 背景流動裝飾 */
      .blob { position: absolute; border-radius: 50%; filter: blur(70px); z-index: -1; opacity: 0.5; }
      .blob-1 { top: -5%; left: -20%; width: 300px; height: 300px; background: var(--red-deep); animation: float 10s infinite ease-in-out;}
      .blob-2 { bottom: 20%; right: -10%; width: 250px; height: 250px; background: var(--camel-dark); animation: float 12s infinite ease-in-out reverse;}

      @keyframes float {
          0%, 100% { transform: translate(0, 0); }
          50% { transform: translate(10px, 20px); }
      }
    
      /* --- 照片區域 --- */
      .header-cover {
        width: 100%;
        height: 62vh; 
        position: relative;
        background: linear-gradient(to bottom, var(--red-deep), #5e161a);
        display: flex; justify-content: center; align-items: flex-end;
        padding-bottom: 20px;
      }
    
      .header-cover img {
        /* --- 修正重點：改為自動縮放與 Contain --- */
        width: auto; 
        height: auto;
        max-width: 90%;
        max-height: 95%;
        
        object-fit: contain; /* 關鍵：讓整張照片完整顯示，不被裁切 */
        object-position: bottom center;
        
        /* 保留原本樣式 */
        border-radius: 20px;
        border: 4px solid rgba(255,255,255,0.2);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        transform: translateY(10px);
        z-index: 2;
      }
    
      /* --- 資訊卡片 --- */
      .content-card {
        flex: 1;
        background: var(--glass-bg);
        border-radius: 35px 35px 0 0;
        margin-top: -30px; 
        position: relative; z-index: 5;
        padding: 40px 25px 110px; 
        border-top: 1px solid var(--glass-border);
        box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        
        animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes slideUp {
          from { transform: translateY(50px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
      }
    
      .profile-header { text-align: center; margin-bottom: 35px; }
    
      /* 皇冠標籤 */
      .badge-crown {
        display: inline-flex; align-items: center; gap: 2px;
        background: linear-gradient(135deg, #fff 0%, #FFF8F0 100%);
        color: var(--camel-dark);
        padding: 5px 18px; border-radius: 50px;
        font-size: 15px; font-weight: 900;
        box-shadow: 0 4px 15px rgba(194, 155, 107, 0.2);
        border: 1px solid #fff;
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
    
      h1 { font-size: 30px; margin: 0 0 8px 0; letter-spacing: 1.5px; color: var(--text-primary); font-weight: 800; }
      .job-title { color: var(--red-deep); font-weight: 700; font-size: 16px; margin-bottom: 6px; letter-spacing: 0.5px; }
      .company { font-size: 14px; color: var(--text-secondary); font-weight: 500; opacity: 0.8; }
    
      .tags-row { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap;}
      .tag-pill { 
        background: rgba(194, 155, 107, 0.1); color: #9E7D58;
        font-size: 16px; padding: 6px 14px; border-radius: 12px; font-weight: 700;
        border: 1px solid rgba(194, 155, 107, 0.2);
      }
    
      .section-title { 
        font-size: 20px; font-weight: 800; margin: 30px 0 20px; 
        color: var(--text-primary); display: flex; align-items: center;
      }
      .section-title::before {
        content: ''; display: inline-block; width: 4px; height: 18px;
        background: var(--red-deep); margin-right: 12px; border-radius: 4px;
      }
    
      .detail-item { display: flex; align-items: flex-start; margin-bottom: 24px; }
      .icon-box { 
          min-width: 40px; height: 40px; 
          background: linear-gradient(135deg, var(--red-deep), var(--red-accent)); 
          color: #fff; border-radius: 14px; 
          display: flex; align-items: center; justify-content: center; 
          font-size: 20px; margin-right: 16px; 
          box-shadow: 0 6px 15px rgba(150, 47, 53, 0.25); 
      }
      .text-box h3 { margin: 0 0 6px 0; font-size: 18px; color: var(--text-primary); font-weight: 700; }
      .text-box p { margin: 0; font-size: 14px; color: var(--text-secondary); line-height: 1.7; text-align: justify; font-weight: 400; }
    
      /* 底部按鈕區 */
      .floating-footer { 
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; 
        background: rgba(255,252,245,0.95);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255,255,255,0.8); 
        padding: 15px 20px 30px; 
        display: flex; gap: 12px; z-index: 100; 
        box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
      }
      
      .btn { 
          flex: 1; height: 56px; border-radius: 14px; 
          display: flex; justify-content: center; align-items: center; 
          text-decoration: none; font-weight: 700; font-size: 18px; 
          transition: transform 0.1s active; 
      }
      .btn:active { transform: scale(0.98); }
      
      /* 電話按鈕 */
      .btn-call { 
          background: linear-gradient(to right, var(--red-deep), #AD363D); 
          color: white; border: none; 
          box-shadow: 0 8px 20px rgba(150, 47, 53, 0.3); 
          flex: 1.2; 
      }
      
      /* LINE 按鈕 */
      .btn-line { 
          background: #fff; 
          color: var(--camel-dark); 
          border: 1px solid var(--camel-dark); 
          display: flex; align-items: center; justify-content: center;
          gap: 3px;
          padding: 0 10px;
          flex: 1;
      }
      
      .btn-line img {
          width: 49px; height: 49px; 
          object-fit: contain;
          border-radius: 2px;
      }

    </style>
</head>
<body>

<div class="mobile-container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="header-cover">
    <img src="https://i.postimg.cc/kMY67W7g/IMG-5788.jpg" alt="張添盛照片">
  </div>

  <div class="content-card">
    <div class="profile-header">
      <div class="badge-crown">🏆 專業傳承規劃+公益</div> 
      
      <h1>張添盛</h1>
      <div class="job-title">首席經理｜資產傳承專家</div>
      <div class="company">永達保險經紀人</div>
      <div class="tags-row">
        <span class="tag-pill">#稅務規劃</span>
        <span class="tag-pill">#財富傳承</span>
        <span class="tag-pill">#資產保全</span>
      </div>
    </div>

    <div class="section-title">核心價值：家族資產傳承</div>

    <div class="detail-item">
      <div class="icon-box">💰</div>
      <div class="text-box">
        <h3>預留稅源，資產完整</h3>
        <p>善用保險槓桿準備遺產稅金，避免子女變賣資產繳稅，守護家族財富完整性。</p>
      </div>
    </div>
    <div class="detail-item">
      <div class="icon-box">⚖️</div>
      <div class="text-box">
        <h3>指定受益，紛爭歸零</h3>
        <p>透過保單指定受益人功能，依照您的意願精準分配，減少特留分爭議與家庭糾紛。</p>
      </div>
    </div>
    <div class="detail-item">
      <div class="icon-box">🛡️</div>
      <div class="text-box">
        <h3>信託結合，長久守護</h3>
        <p>結合保險金信託，防止資金被揮霍或挪用，實現富過三代的長遠承諾。</p>
      </div>
    </div>
  </div> 
  
  <div class="floating-footer">
    <a href="tel:0988354250" class="btn btn-call">
       📞 0988-354250
    </a>
    
    <a href="https://line.me/ti/p/en9UrNT9eA" class="btn btn-line">
       <span>💬 加 LINE</span>
       <img src="https://i.postimg.cc/0NCjFwVh/IMG-5789.jpg" alt="QR Code">
    </a>
  </div>

</div>

</body>
</html>
